name: Build
on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build